<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="../../assets/icons/favicon-32x32.png" type="image/png">
    <title>Stats preview card component</title>
</head>

<body>
    <main>
        <div class="card">
            <div class="card__content">
                <h1>Get <span class="card__header">insights</span> that help your business grow.</h1>
                <p class="card__text">Discover the benefits of data analytics and make better decisions regarding
                    revenue,
                    customer experience, and overall efficiency.</p>
                <div class="card__stat">
                    <div class="card__stat-item">
                        <p class="stat-value">10k+</p>
                        <p class="stat-item">companies</p>
                    </div>
                    <div class="card__stat-item">
                        <p class="stat-value">314</p>
                        <p class="stat-item">templates</p>
                    </div>
                    <div class="card__stat-item">
                        <p class="stat-value">12M+</p>
                        <p class="stat-item">queries</p>
                    </div>
                </div>
            </div>
            <div class="card__img">
                <img src="../../assets/images/image-header-desktop.jpg" alt="img header" class="img">
            </div>
        </div>
    </main>

</body>

</html>
